# Render's free tier stops the container after ~15 minutes idle, and the next
# request then waits 30-50s for a cold boot. This pings liveness often enough
# to keep it running.
#
# /healthz, not /readyz: liveness never touches the database, so the ping costs
# one in-memory response rather than a connection per run.
#
# Set the repo variable APP_URL (Settings -> Secrets and variables -> Actions ->
# Variables) to the deployed base URL. Without it the job no-ops instead of
# failing, so a fork with no deployment stays green.
name: keep-warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping liveness
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL is not set; nothing to keep warm."
            exit 0
          fi
          # Generous timeout: if the container IS cold, this request is the one
          # paying for the boot, and that is the whole point.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$APP_URL/healthz" || echo 000)
          echo "GET $APP_URL/healthz -> $code"
          [ "$code" = "200" ]
